                states: ["NY", "CA", "FL", "TX", "IL"]

                name: "Business Express Funding",
                minMonthlyRevenue: 8000,
                minTimeInBusiness: 4,
                minCreditScore: 580,
                maxNegativeDays: 20,
                industries: ["Food Service", "Retail", "Healthcare", "Construction", "Auto Repair"],
                states: ["All"]

                name: "Premier Financial Group",
                minMonthlyRevenue: 15000,
                minTimeInBusiness: 12,
                minCreditScore: 650,
                maxNegativeDays: 10,
                industries: ["Healthcare", "IT Services", "Professional Services", "Manufacturing"],
                states: ["CA", "NY", "TX", "FL", "IL", "PA", "OH"]

        document.getElementById('funderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const monthlyRevenue = parseFloat(document.getElementById('monthlyRevenue').value);
            const timeInBusiness = parseInt(document.getElementById('timeInBusiness').value);
            const creditScore = parseInt(document.getElementById('creditScore').value);
            const negativeDays = parseInt(document.getElementById('negativeDays').value);
            const state = document.getElementById('state').value;

            // Validate inputs
            if (!industryType || !monthlyRevenue || !timeInBusiness || !creditScore || negativeDays === '' || !state) {
                alert('Please fill in all fields');
                return;
            }

            const matchingFunders = funders.filter(funder => {
                const stateMatch = funder.states.includes('All') || funder.states.includes(state);
                const industryMatch = funder.industries.includes(industryType);
                const revenueMatch = monthlyRevenue >= funder.minMonthlyRevenue;
                const timeMatch = timeInBusiness >= funder.minTimeInBusiness;
                const creditMatch = creditScore >= funder.minCreditScore;
                const daysMatch = negativeDays <= funder.maxNegativeDays;

                return stateMatch && industryMatch && revenueMatch && timeMatch && creditMatch && daysMatch;
            });

            displayResults(matchingFunders);
        });

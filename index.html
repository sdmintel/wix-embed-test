<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funder Filtration Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Funder Filtration Tool</h1>
        <form id="funderForm" class="grid grid-cols-2 gap-4">
            <!-- Left Column -->
            <div class="space-y-4">
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700">Industry Type</label>
                    <select id="industryType" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <option value="">Select Industry</option>
                        <option value="Accounting">Accounting</option>
                        <option value="Agriculture">Agriculture</option>
                        <option value="Auto Repair">Auto Repair</option>
                        <option value="Construction">Construction</option>
                        <option value="Consulting">Consulting</option>
                        <option value="Dental">Dental</option>
                        <option value="E-commerce">E-commerce</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Financial Services">Financial Services</option>
                        <option value="Food Service">Food Service</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Home Services">Home Services</option>
                        <option value="Hospitality">Hospitality</option>
                        <option value="IT Services">IT Services</option>
                        <option value="Legal Services">Legal Services</option>
                        <option value="Manufacturing">Manufacturing</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Medical">Medical</option>
                        <option value="Real Estate">Real Estate</option>
                        <option value="Retail">Retail</option>
                        <option value="Software">Software</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Wholesale">Wholesale</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700">Monthly Revenue</label>
                    <input type="number" id="monthlyRevenue" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Enter amount in dollars">
                </div>

                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700">Time in Business (months)</label>
                    <input type="number" id="timeInBusiness" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Enter months">
                </div>
            </div>
            <!-- Right Column -->
            <div class="space-y-4">
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700">Credit Score</label>
                    <input type="number" id="creditScore" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Enter credit score">
                </div>

                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700">Negative Balance Days</label>
                    <input type="number" id="negativeDays" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Enter days" max="20">
                </div>

                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700">State</label>
                    <select id="state" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <option value="">Select State</option>
                        <option value="AL">Alabama</option>
                        <option value="AK">Alaska</option>
                        <option value="AZ">Arizona</option>
                        <option value="AR">Arkansas</option>
                        <option value="CA">California</option>
                        <option value="CO">Colorado</option>
                        <option value="CT">Connecticut</option>
                        <option value="DE">Delaware</option>
                        <option value="FL">Florida</option>
                        <option value="GA">Georgia</option>
                        <option value="HI">Hawaii</option>
                        <option value="ID">Idaho</option>
                        <option value="IL">Illinois</option>
                        <option value="IN">Indiana</option>
                        <option value="IA">Iowa</option>
                        <option value="KS">Kansas</option>
                        <option value="KY">Kentucky</option>
                        <option value="LA">Louisiana</option>
                        <option value="ME">Maine</option>
                        <option value="MD">Maryland</option>
                        <option value="MA">Massachusetts</option>
                        <option value="MI">Michigan</option>
                        <option value="MN">Minnesota</option>
                        <option value="MS">Mississippi</option>
                        <option value="MO">Missouri</option>
                        <option value="MT">Montana</option>
                        <option value="NE">Nebraska</option>
                        <option value="NV">Nevada</option>
                        <option value="NH">New Hampshire</option>
                        <option value="NJ">New Jersey</option>
                        <option value="NM">New Mexico</option>
                        <option value="NY">New York</option>
                        <option value="NC">North Carolina</option>
                        <option value="ND">North Dakota</option>
                        <option value="OH">Ohio</option>
                        <option value="OK">Oklahoma</option>
                        <option value="OR">Oregon</option>
                        <option value="PA">Pennsylvania</option>
                        <option value="RI">Rhode Island</option>
                        <option value="SC">South Carolina</option>
                        <option value="SD">South Dakota</option>
                        <option value="TN">Tennessee</option>
                        <option value="TX">Texas</option>
                        <option value="UT">Utah</option>
                        <option value="VT">Vermont</option>
                        <option value="VA">Virginia</option>
                        <option value="WA">Washington</option>
                        <option value="WV">West Virginia</option>
                        <option value="WI">Wisconsin</option>
                        <option value="WY">Wyoming</option>
                    </select>
                </div>
            </div>

            <!-- Submit Button (Full Width) -->
            <div class="col-span-2 text-center mt-6">
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg w-full md:w-auto">
                    Find Matching Funders
                </button>
            </div>
        </form>

        <div id="results" class="mt-8 space-y-4"></div>
    </div>
    <script>
        const funders = [
            {
                name: "Capital Growth Solutions",
                minMonthlyRevenue: 10000,
                minTimeInBusiness: 6,
                minCreditScore: 600,
                maxNegativeDays: 15,
                industries: ["Retail", "E-commerce", "Manufacturing", "Wholesale", "Transportation"],
                states: ["NY", "CA", "FL", "TX", "IL"]
            },
            {
                name: "Business Express Funding",
                minMonthlyRevenue: 8000,
                minTimeInBusiness: 4,
                minCreditScore: 580,
                maxNegativeDays: 20,
                industries: ["Food Service", "Retail", "Healthcare", "Construction", "Auto Repair"],
                states: ["All"]
            },
            {
                name: "Premier Financial Group",
                minMonthlyRevenue: 15000,
                minTimeInBusiness: 12,
                minCreditScore: 650,
                maxNegativeDays: 10,
                industries: ["Healthcare", "IT Services", "Professional Services", "Manufacturing"],
                states: ["CA", "NY", "TX", "FL", "IL", "PA", "OH"]
            }
        ];

        document.getElementById('funderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const industryType = document.getElementById('industryType').value;
            const monthlyRevenue = parseFloat(document.getElementById('monthlyRevenue').value);
            const timeInBusiness = parseInt(document.getElementById('timeInBusiness').value);
            const creditScore = parseInt(document.getElementById('creditScore').value);
            const negativeDays = parseInt(document.getElementById('negativeDays').value);
            const state = document.getElementById('state').value;

            // Validate inputs
            if (!industryType || !monthlyRevenue || !timeInBusiness || !creditScore || negativeDays === '' || !state) {
                alert('Please fill in all fields');
                return;
            }

            const matchingFunders = funders.filter(funder => {
                const stateMatch = funder.states.includes('All') || funder.states.includes(state);
                const industryMatch = funder.industries.includes(industryType);
                const revenueMatch = monthlyRevenue >= funder.minMonthlyRevenue;
                const timeMatch = timeInBusiness >= funder.minTimeInBusiness;
                const creditMatch = creditScore >= funder.minCreditScore;
                const daysMatch = negativeDays <= funder.maxNegativeDays;

                return stateMatch && industryMatch && revenueMatch && timeMatch && creditMatch && daysMatch;
            });

            displayResults(matchingFunders);
        });

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            if (matchingFunders.length === 0) {
                resultsDiv.innerHTML = '<p class="text-center text-gray-600">No matching funders found. Please adjust your criteria.</p>';
                return;

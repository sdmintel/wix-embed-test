<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funder Filtration Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .results {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h2>Funder Filtration Tool</h2>
    <form id="funderForm">
        <div class="form-group">
            <label for="timeInBusiness">Time in Business (months)</label>
            <input type="number" id="timeInBusiness" min="6" required>
        </div>
        <div class="form-group">
            <label for="monthlyRevenue">Average Monthly Revenue</label>
            <input type="number" id="monthlyRevenue" min="0" required>
        </div>
        <div class="form-group">
            <label for="requestedAmount">Requested Amount</label>
            <input type="number" id="requestedAmount" min="0" required>
        </div>
        <div class="form-group">
            <label for="industry">Industry Type</label>
            <select id="industry" required>
                <option value="">Select Industry</option>
                <option value="retail">Retail</option>
                <option value="restaurant">Restaurant</option>
                <option value="service">Service</option>
                <option value="manufacturing">Manufacturing</option>
                <option value="construction">Construction</option>
                <option value="healthcare">Healthcare</option>
                <!-- Add more industries as needed -->
            </select>
        </div>
        <div class="form-group">
            <label for="fico">FICO Score</label>
            <input type="number" id="fico" min="300" max="850" required>
        </div>
        <div class="form-group">
            <label for="state">State of Incorporation</label>
            <select id="state" required>
                <option value="">Select State</option>
                <!-- All 50 states will be populated via JavaScript -->
            </select>
        </div>
        <div class="form-group">
            <label for="negativeBalanceDays">Negative Balance Days</label>
            <input type="number" id="negativeBalanceDays" min="0" max="20" required>
        </div>
        <div class="form-group">
            <label for="currentPositions">Current Positions</label>
            <input type="number" id="currentPositions" min="0" max="7" required>
        </div>
        <button type="submit">Find Matches</button>
    </form>
    <div id="results" class="results" style="display:none;">
        <h3>Matching Results</h3>
        <div id="matchList"></div>
    </div>
    <script>
        // States data
        const states = [
            'AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DE', 'FL', 'GA',
            'HI', 'ID', 'IL', 'IN', 'IA', 'KS', 'KY', 'LA', 'ME', 'MD',
            'MA', 'MI', 'MN', 'MS', 'MO', 'MT', 'NE', 'NV', 'NH', 'NJ',
            'NM', 'NY', 'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'RI', 'SC',
            'SD', 'TN', 'TX', 'UT', 'VT', 'VA', 'WA', 'WV', 'WI', 'WY'
        ];

        // Populate states dropdown
        const stateSelect = document.getElementById('state');
        states.forEach(state => {
            const option = document.createElement('option');
            option.value = state;
            option.textContent = state;
            stateSelect.appendChild(option);
        });

        // Form submission handler
        document.getElementById('funderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const data = {
                timeInBusiness: parseInt(document.getElementById('timeInBusiness').value),
                monthlyRevenue: parseFloat(document.getElementById('monthlyRevenue').value),
                requestedAmount: parseFloat(document.getElementById('requestedAmount').value),
                industry: document.getElementById('industry').value,
                fico: parseInt(document.getElementById('fico').value),
                state: document.getElementById('state').value,
                negativeBalanceDays: parseInt(document.getElementById('negativeBalanceDays').value),
                currentPositions: parseInt(document.getElementById('currentPositions').value)
            };

            // Validate inputs
            if (data.negativeBalanceDays > 20) {
                alert('Negative balance days cannot exceed 20');
                return;
            }

            // Calculate matching score
            const score = calculateMatchScore(data);

            // Display results
            displayResults(score, data);
        });

        function calculateMatchScore(data) {
            let score = 0;

            // Time in business scoring (6+ months)
            if (data.timeInBusiness >= 12) score += 1.5;
            else if (data.timeInBusiness >= 9) score += 1.0;
            else if (data.timeInBusiness >= 6) score += 0.5;

            // Monthly revenue scoring
            if (data.monthlyRevenue >= 100000) score += 2;
            else if (data.monthlyRevenue >= 50000) score += 1.5;
            else if (data.monthlyRevenue >= 25000) score += 1;

            // FICO scoring
            if (data.fico >= 700) score += 2;
            else if (data.fico >= 650) score += 1.5;
            else if (data.fico >= 600) score += 1;

            // Negative balance days scoring
            if (data.negativeBalanceDays <= 5) score += 2;
            else if (data.negativeBalanceDays <= 10) score += 1;
            else if (data.negativeBalanceDays <= 15) score += 0.5;

            // Current positions scoring
            score += Math.min(data.currentPositions, 3) * 1;

            return score;
        }

        function displayResults(score, data) {
            const resultsDiv = document.getElementById('results');
            const matchList = document.getElementById('matchList');
            
            resultsDiv.style.display = 'block';
            matchList.innerHTML = `
                <p>Match Score: ${score.toFixed(1)} / 10.5</p>
                <p>Summary:</p>
                <ul>
                    <li>Time in Business: ${data.timeInBusiness} months</li>
                    <li>Monthly Revenue: $${data.monthlyRevenue.toLocaleString()}</li>
                    <li>Requested Amount: $${data.requestedAmount.toLocaleString()}</li>
                    <li>Industry: ${data.industry}</li>
                    <li>FICO Score: ${data.fico}</li>
                    <li>State: ${data.state}</li>
                    <li>Negative Balance Days: ${data.negativeBalanceDays}</li>
                    <li>Current Positions: ${data.currentPositions}</li>
                </ul>
            `;
        }
    </script>
</body>
</html>

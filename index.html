<!DOCTYPE html>
<html>
<head>
    <title>Funder Filter</title>

        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .filters { margin: 20px 0; }
        input, select { margin: 5px; padding: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Funder Filter</h1>

                <option>Technology</option>

            </select>
        </div>
        <div id="results">
            <p>Sample Funder 1</p>
            <p>Sample Funder 2</p>
        </div>
    </div>
</body>
</html>
